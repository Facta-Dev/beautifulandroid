name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - android-best-practices (writing code)
        - android-review (reviewing code)
        - android-port (porting to Android)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the Android developer documentation, the Compose guidance, the facta Android handbook, the detekt/ktlint docs, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: kotlin
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: kotlin
